apiVersion: apps/v1
kind: Deployment
metadata:
  name: spms-deployment
  labels:
    app: spms-test
spec:
  selector:
    matchLabels:
      app: spms-test
  template:
    metadata:
      labels:
        app: spms-test
    spec:
      containers:
        - name: spms-backend
          envFrom:
            - secretRef:
                name: spms-env-test
          volumeMounts:
            - name: spms-media-test
              mountPath: /mnt/oldfiles
            - name: spms-media-blob-test
              mountPath: /usr/src/app/backend/files
            - name: prince2-license-test
              mountPath: /usr/lib/prince/license
              readOnly: true
      volumes:
        - name: spms-media-test
          persistentVolumeClaim:
            claimName: spms-media-data-test
        - name: spms-media-blob-test
          persistentVolumeClaim:
            claimName: pvc-spms-media-data-blob-test
        - name: prince2-license-test
          configMap:
            defaultMode: 420
            name: prince2-license-test
