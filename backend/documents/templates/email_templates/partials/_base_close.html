          </td>
        </tr>
        <!-- 4-part coloured bar at bottom with gaps -->
        <tr>
          <td style="padding: 0 20px; font-size: 0; line-height: 0; background-color: #ffffff;">
            <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="border-spacing: 6px 0; margin: 0 -6px;">
              <tr>
                <td style="width: 25%; height: 4px; background-color: #2A6096; border-radius: 2px;">&nbsp;</td>
                <td style="width: 25%; height: 4px; background-color: #01A7B2; border-radius: 2px;">&nbsp;</td>
                <td style="width: 25%; height: 4px; background-color: #FFC530; border-radius: 2px;">&nbsp;</td>
                <td style="width: 25%; height: 4px; background-color: #1E5456; border-radius: 2px;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Bottom padding -->
        <tr>
          <td style="height: 12px; font-size: 0; line-height: 0;">&nbsp;</td>
        </tr>
      </tbody>
    </table>
    {% if show_confetti %}
    <script>
    (function(){
      var COLORS=['#1e40af','#3b82f6','#60a5fa','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899'];
      var SHAPES=['square','circle','strip'];
      var c=document.getElementById('confetti-container');
      if(c){
        c.innerHTML='';
        for(var i=0;i<80;i++){
          var p=document.createElement('div');
          p.className='confetti-piece';
          var s=SHAPES[Math.floor(Math.random()*SHAPES.length)];
          var col=COLORS[Math.floor(Math.random()*COLORS.length)];
          var sz=6+Math.random()*10;
          p.style.left=Math.random()*100+'%';
          p.style.width=(s==='strip'?sz*0.4:sz)+'px';
          p.style.height=(s==='strip'?sz*1.8:sz)+'px';
          p.style.backgroundColor=col;
          p.style.borderRadius=s==='circle'?'50%':'2px';
          p.style.animationDuration=(2+Math.random()*2)+'s';
          p.style.animationDelay=(Math.random()*0.8)+'s';
          c.appendChild(p);
        }
        setTimeout(function(){c.innerHTML='';},5000);
      }
    })();
    </script>
    {% endif %}
  </body>
</html>
